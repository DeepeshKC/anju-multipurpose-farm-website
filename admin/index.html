<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Blog Administration | Anju Farm</title><link rel="stylesheet" href="../css/style.css"><style>.admin-wrap{max-width:1050px;margin:auto;padding:55px 5%}.admin-wrap input,.admin-wrap textarea,.admin-wrap select{width:100%;padding:12px;border:1px solid #aeb7ae;border-radius:3px;font:inherit;background:white}.admin-wrap label{display:block;margin:15px 0 5px;font-weight:600}.admin-wrap textarea{min-height:260px}.admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.admin-list button{margin:5px;padding:8px 12px}.admin-list li{margin-bottom:10px}.admin-note{color:#526456}.admin-error{color:#9a2626}</style><script src="../js/admin.js" defer></script></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span class="brand-text"><strong>ANJU FARM</strong><small>BLOG ADMINISTRATION</small></span></a><a href="../blog.html">View blog ↗</a></header><main class="admin-wrap"><h1 style="font-size:2.6rem;color:var(--green)">Manage blog</h1><p id="notice" role="status" aria-live="polite"></p><section id="login-section" hidden><h2>Administrator sign in</h2><form id="login-form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><div class="admin-actions"><button class="button button-dark">Sign in</button></div></form></section><section id="editor-section" hidden><div class="admin-actions"><button id="new-post" class="button button-dark" type="button">New article</button><button id="logout" type="button">Sign out</button></div><h2 style="font-size:2rem;margin-top:35px">Articles</h2><ul id="posts-list" class="admin-list"></ul><h2 id="editor-heading" style="font-size:2rem">New article</h2><form id="post-form"><label for="title">Title</label><input id="title" required maxlength="150"><label for="slug">URL slug (lowercase letters, numbers, hyphens)</label><input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100"><label for="category">Category</label><input id="category" value="FARM STORIES" maxlength="60" required><label for="excerpt">Short summary</label><textarea id="excerpt" maxlength="350" style="min-height:90px"></textarea><label for="content">Article content (plain text; separate paragraphs with blank lines)</label><textarea id="content" required></textarea><label for="status">Publication status</label><select id="status"><option value="draft">Draft — private</option><option value="published">Published — public</option></select><div class="admin-actions"><button class="button button-dark" type="submit">Save article</button><button id="delete-post" type="button" hidden>Delete article</button></div></form></section></main></body></html>
